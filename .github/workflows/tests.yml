name: tests

on:
  push:
    branches: [main]
    paths:
      - "canonical/**"
      - "chronicle/**"
      - "chronicle-raft/**"
      - "compression/**"
      - "kernel/**"
      - "policy/**"
      - "receipt/**"
      - "schemas/**"
      - "src/**"
      - "tests/**"
      - "tools/**"
      - "triadic_controls/**"
      - "weaver_auth/**"
      - "witness_py/**"
      - "pyproject.toml"
      - "requirements.txt"
  pull_request:
    branches: [main]
    paths:
      - "canonical/**"
      - "chronicle/**"
      - "chronicle-raft/**"
      - "compression/**"
      - "kernel/**"
      - "policy/**"
      - "receipt/**"
      - "schemas/**"
      - "src/**"
      - "tests/**"
      - "tools/**"
      - "triadic_controls/**"
      - "weaver_auth/**"
      - "witness_py/**"
      - "pyproject.toml"
      - "requirements.txt"

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run tests
        run: pytest

      - name: Build wheel and sdist
        run: python -m build

      - name: Run CLI smoke checks
        run: |
          weaver-release-guard --help
          weaver-release-guard generate --help
          weaver-release-guard verify --help
