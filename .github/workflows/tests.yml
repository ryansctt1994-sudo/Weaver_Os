name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run tests
        run: pytest

      - name: Run WN-E2E-001 transaction and fresh-process replay
        run: python demo/e2e_transaction.py demo receipts/wn-e2e-001

      - name: Retain WN-E2E-001 local evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wn-e2e-001-python-${{ matrix.python-version }}
          path: receipts/wn-e2e-001/

      - name: Build wheel and sdist
        run: python -m build

      - name: Run CLI smoke checks
        run: |
          weaver-release-guard --help
          weaver-release-guard generate --help
          weaver-release-guard verify --help
