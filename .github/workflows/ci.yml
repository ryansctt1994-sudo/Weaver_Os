name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test, lint, type-check, and package
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Run witness from verified snapshot
        run: python -m tools.run_verified_witness releases/weaver-witness-signed-rc1/WEAVER_WITNESS_SIGNED_RC1.zip --expected-key-sha256 5ac8e9d25de8d37cd9165d4a7458c34634aeded53c1709573ddf4cc122bcefb9

      - name: Type check
        run: mypy triadic_controls src

      - name: Run tests
        run: pytest -q

      - name: Check verifier gate mutations
        run: python -m tools.check_verifier_mutations

      - name: Build package
        run: python -m build
