name: CI

on:
  push:
    branches: [main]
    paths:
      - "canonical/**"
      - "chronicle/**"
      - "chronicle-raft/**"
      - "compression/**"
      - "kernel/**"
      - "policy/**"
      - "receipt/**"
      - "schemas/**"
      - "src/**"
      - "tests/**"
      - "tools/**"
      - "triadic_controls/**"
      - "weaver_auth/**"
      - "witness_py/**"
      - "pyproject.toml"
      - "requirements.txt"
  pull_request:
    branches: [main]
    paths:
      - "canonical/**"
      - "chronicle/**"
      - "chronicle-raft/**"
      - "compression/**"
      - "kernel/**"
      - "policy/**"
      - "receipt/**"
      - "schemas/**"
      - "src/**"
      - "tests/**"
      - "tools/**"
      - "triadic_controls/**"
      - "weaver_auth/**"
      - "witness_py/**"
      - "pyproject.toml"
      - "requirements.txt"

jobs:
  test:
    name: Test, lint, type-check, and package
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Type check
        run: mypy triadic_controls src

      - name: Run tests
        run: pytest -q

      - name: Build package
        run: python -m build
