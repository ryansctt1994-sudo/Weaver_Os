name: Four-repo consolidation ledger
on:
  pull_request:
    paths:
      - "governance/consolidation-v0.1/**"
      - ".github/workflows/consolidation-ledger.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ledger:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python governance/consolidation-v0.1/ledger.py --self-test
      - run: python governance/consolidation-v0.1/ledger.py
      - run: python governance/consolidation-v0.1/ledger_v02.py --self-test
      - run: python governance/consolidation-v0.1/ledger_v02.py
