name: Exact-commit operator rehearsal

# Runs on every PR and every push to main. An operator can also rehearse any exact
# commit on demand. The expected commit always comes from the event (or the
# operator's input), never from the checkout under test, and the tool itself
# strips GITHUB_SHA/GITHUB_REF before running the verifier.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      expected_head:
        description: "Full 40-hex commit SHA to rehearse"
        required: true
        type: string

permissions:
  contents: read

jobs:
  source-replay:
    name: Detached source operator rehearsal
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      EXPECTED_SOURCE_SHA: ${{ inputs.expected_head || github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Refuse a malformed expected commit before checkout
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$EXPECTED_SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "REFUSED: expected head is not a full lowercase 40-hex SHA" >&2
            exit 1
          fi

      - name: Check out exact source commit detached
        uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_SOURCE_SHA }}
          persist-credentials: false

      - name: Set up locked Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up TLC Java runtime
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install pinned verifier dependencies
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/operator-evidence"
          python -m pip install -r requirements-verification.lock \
            2>&1 | tee "$RUNNER_TEMP/operator-evidence/dependency-install.log"
          python -m pip freeze > "$RUNNER_TEMP/operator-evidence/environment.txt"

      - name: Execute exact-source reproduction without witness claim
        shell: bash
        run: |
          set -euo pipefail
          python -m tools.reproduce_review_candidate \
            --expected-head "$EXPECTED_SOURCE_SHA" \
            2>&1 | tee "$RUNNER_TEMP/operator-evidence/local-result.json"

      - name: Retain local result and raw verifier files even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: operator-rehearsal-${{ env.EXPECTED_SOURCE_SHA }}
          path: |
            ${{ runner.temp }}/operator-evidence/
            verification-output/
          if-no-files-found: error
