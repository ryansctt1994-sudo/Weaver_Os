name: E3.5 hold gate

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e35-withheld:
    name: Require E3.5 to remain withheld
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install declared verification dependencies
        run: |
          python -m pip install --disable-pip-version-check -r requirements-verification.lock
          python -c "from jsonschema import Draft7Validator; print('SCHEMA_VALIDATOR_IMPORT_OK')"

      - name: Run local fail-closed spine
        run: |
          python3 tools/fail_closed_spine.py
          python3 tools/fail_closed_spine.py --tamper

      - name: Prove that the E3.5 verifier actually ran and withheld
        env:
          WEAVER_SOURCE_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python -m tools.check_e35_withheld --output e35-output.txt

      - name: Retain E3.5 hold evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e35-hold-${{ github.sha }}
          path: e35-output.txt
          if-no-files-found: error
