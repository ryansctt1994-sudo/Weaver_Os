name: Portfolio candidate assurance metadata

on:
  push:
    branches: [main]
    paths:
      - 'governance/portfolio/**'
      - 'tools/check_portfolio_assurance.py'
      - 'tests/test_portfolio_assurance.py'
      - '.github/workflows/portfolio-assurance.yml'
  pull_request:
    paths:
      - 'governance/portfolio/**'
      - 'tools/check_portfolio_assurance.py'
      - 'tests/test_portfolio_assurance.py'
      - '.github/workflows/portfolio-assurance.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  candidate-metadata:
    name: Reject unearned portfolio promotion
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check frozen candidate snapshot (not a live inventory or independent witness)
        run: python -m tools.check_portfolio_assurance
      - name: Run negative mutation and valid-path tests
        run: python -m unittest discover -s tests -p test_portfolio_assurance.py -v
