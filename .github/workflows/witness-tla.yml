name: Witness TLA model
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  tlc:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Acquire pinned TLC
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p verification-output
          python3 -m tools.fetch_tlc "$RUNNER_TEMP/tla2tools.jar" | tee verification-output/tlc-download.log
      - name: Check bounded invariants
        working-directory: audit-package/formal/tla+
        shell: bash
        run: |
          set -euo pipefail
          java -cp "$RUNNER_TEMP/tla2tools.jar" tlc2.TLC -deadlock -config WitnessBoundary.cfg WitnessBoundary.tla 2>&1 | tee "$GITHUB_WORKSPACE/verification-output/tlc.log"
      - name: Retain TLC evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tla-${{ github.sha }}
          path: verification-output/
          if-no-files-found: warn
