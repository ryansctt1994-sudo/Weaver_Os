name: CP8 Verified Core
on:
  pull_request:
    branches: [main, codex/gofb-hydro-core]
jobs:
  runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Core and topology checks
        working-directory: research/cp8
        run: |
          set -o pipefail
          node test_core.js 2>&1 | tee core.log
          python -m unittest test_topology -v 2>&1 | tee topology.log
      - name: Browser checks
        working-directory: research/cp8
        run: |
          set -o pipefail
          npm install --no-save playwright@1.62.1
          npx playwright install --with-deps chromium
          node test_browser.js 2>&1 | tee browser.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cp8-runtime-evidence
          path: research/cp8/*.log
  formal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Lean
        run: |
          curl -fL --retry 3 https://github.com/leanprover/lean4/releases/download/v4.19.0/lean-4.19.0-linux.tar.zst -o /tmp/lean.tar.zst
          tar --zstd -xf /tmp/lean.tar.zst -C /tmp
          echo /tmp/lean-4.19.0-linux/bin >> "$GITHUB_PATH"
      - name: Build and audit
        working-directory: formal/efmw-core
        run: |
          set -o pipefail
          lake update 2>&1 | tee cp8-dependencies.log
          lake exe cache get
          lake build 2>&1 | tee cp8-build.log
          lake env lean CP8Audit.lean 2>&1 | tee cp8-axioms.log
          if grep -E 'sorryAx|^axiom ' cp8-axioms.log; then exit 1; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cp8-formal-evidence
          path: |
            formal/efmw-core/cp8-*.log
            formal/efmw-core/lake-manifest.json
