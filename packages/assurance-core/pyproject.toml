[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "weaver-assurance-core"
version = "0.2.0"
description = "Evidence-bound authority, replay, receipt, and Chronicle primitives"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = ["cryptography>=42"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
weaver-assurance = "weaver_assurance.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110

