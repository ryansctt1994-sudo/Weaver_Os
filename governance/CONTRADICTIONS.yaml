schema_version: "1.0"
registry_id: "WX-CONTRADICTIONS"
format_source: "Lumen-Nexus governance/CONTRADICTIONS.yaml"
default_disposition: "FAIL_CLOSED"
note: >-
  Contradictions raised by the unified-system consolidation. Lumen-Nexus entries
  (C-RCPT-001, C-EVID-001, C-PR006-001, C-ANCHOR-001, C-DUAL-001) stay authoritative
  in that repository's registry until it is merged in; C-DUAL-001 is mirrored here
  because GD-0001 depends on it.

contradictions:
  - id: "C-LADDER-001"
    title: "Four incompatible evidence vocabularies"
    severity: "HIGH"
    status: "RESOLVED"
    domain: "evidence"
    statement: "Lumen E0-E5, Weaver E-levels, Nexus R0-R6 and triad labels were used side by side without a mapping."
    disposition:
      decision: "GD-0001"
      artifact: "governance/evidence_crosswalk.json"
      limitation: "Ratified in SINGLE_STEWARD mode while C-DUAL-001 is open."

  - id: "C-STUB-001"
    title: "Anchor repository stubs for core primitives"
    severity: "HIGH"
    status: "OPEN"
    domain: "implementation"
    statement: >-
      policy/policy_gate.py, policy/signed_verifier_adapter.py and
      compression/residual_monitor.py are TODO stubs; chronicle/, receipt/verify.py and
      kernel/reducer.py defer to the RC1 witness archive; schemas/receipt.v1.json is an
      empty schema ({}) and tests/test_receipt_schema.py is a TODO stub.
    progress:
      - "canonical/canonical.py: replaced by a re-export of WX-CJSON-1 (step 2)."
      - "Receipt contract wx-receipt-1 added; supersedes schemas/receipt.v1.json for new work (step 2)."
    required_disposition:
      - "Replace with the implementations chosen in UNIFIED_SYSTEM_OUTLINE.md sections 5.1-5.5, or delete."
      - "No stub may ship under packages/."

  - id: "C-CANON-001"
    title: "Legacy JSON serializers used for hashing or signing diverge from WX-CJSON-1"
    severity: "MEDIUM"
    status: "OPEN"
    domain: "canonicalization"
    statement: >-
      About a dozen places hash or sign json.dumps(sort_keys=True) output instead of a
      canonical profile. Step 2 recorded three; a repository-wide search in step 4 found the rest.
    inventory:
      pinned_in_tests:
        - "weaver_verifier.crypto.canonicalize_json (moved from triadic_controls): diverges on V12 (key order by code point)"
        - "triadic_controls.ledger.canonical_json (also inline at its append path): V12"
        - "tools.mathos_bench.mathos_bench_v0_1.canonical_json: V12; also accepts floats"
        - "tools.spine_hash.canonical: V09-V13, V17 (escapes all non-ASCII; same key order)"
        - "weaver_verifier.claim_transition._canonical_bytes: V09-V13, V17"
      not_importable_same_class_as_spine_hash:
        - "witness_py/sign_attestation.py canonical_json (signing input)"
        - "inject_ledger.py"
        - "verify_attestations.py"
        - "src/weaver_release_guard/provenance.py (SLSA attestation_digest)"
        - "demo/boundary_integrity_demo.py"
        - "weaver_auth/bedrock/tests/test_all_harnesses.py"
      named_profiles_not_legacy:
        - "PG001R-JSON-1 (weaver_verifier.pg001r._canonical_bytes): Lumen-Nexus diagnostic fingerprints only"
      out_of_scope: "Pretty-printed (indent=2) outputs written to files or stdout, e.g. tools/verify_all.py and tools/emit_spine_receipt.py."
    data_note: >-
      Every serializer agrees with WX-CJSON-1 on integer-only data whose strings are all ASCII.
      MathOS bench data and triad ledger events contain floats, so their digests are outside
      WX-CJSON-1 entirely.
    enforcement: >-
      tools/check_trust_domains.py rejects json.dumps(sort_keys=True) anywhere under packages/
      except three allowlisted files (crypto, claim_transition, pg001r), and rejects a stale
      allowlist entry.
    evidence: "tests/contracts/test_canonical.py pins the five importable divergence sets."
    required_disposition:
      - "Decide per serializer: migrate to WX-CJSON-1 (re-pin affected digests and signatures with a recorded migration) or freeze it as a named legacy profile."
      - "No new authority-bearing code may use a legacy serializer."

  - id: "C-RCPT-001"
    title: "Receipt and hash-chain semantic incompatibility (mirror)"
    severity: "CRITICAL"
    status: "OPEN"
    domain: "receipt-chain"
    source: "Lumen-Nexus governance/CONTRADICTIONS.yaml"
    statement: "receipt.py and hashchain.py assign incompatible linkage semantics and permit caller-owned state."
    progress:
      - "Single-owner ReceiptLedger implemented in packages/runtime (step 3), following Lumen-Nexus ADR-0006."
      - "Reproduced the defect class in Lumen's Chronicle: two instances on one file fork the chain."
      - "Positive, negative, mutation-isolation, concurrency and interrupted-transaction tests in tests/ledger; 8 ledger mutations in tools/check_verifier_mutations.py, all detected."
      - "ADR-0006 accepted for Weaver_Os by GD-0002 (single steward; C-DUAL-001 limitation recorded)."
      - >-
        Step 4 found a second appender with the same defect class: triadic_controls.ledger.TriadLedger.append_event
        takes caller-supplied index and prev_hash and does an unlocked load, check, append. With two writers
        interleaved after load, both appends succeed and the ledger then fails to load (LedgerChainError).
      - >-
        TriadLedger appends are now serialized with an exclusive flock around load, check and append, and fsynced.
        The reproducer is kept as tests/test_triad_ledger_concurrency.py: two interleaved writers (one is refused),
        4 unpatched processes x 10 appends, and a writer killed while holding the lock. Without the lock the
        interleaving test and the unpatched 4-process test both fail; the lock removal is a mutation in
        tools/check_verifier_mutations.py (19/19 detected). The on-disk line format is unchanged.
    remaining:
      - "TriadLedger still takes caller-supplied index and prev_hash (now checked under the lock). Migrating it onto ReceiptLedger is open."
      - "A crash mid-write can leave a torn last line, which makes the triad ledger refuse to load (fail closed, but no recovery path)."
      - "On non-POSIX platforms TriadLedger refuses to append (LedgerLockError)."
      - "Issue a reproducible clean-clone repair receipt under an approved receipt profile (blocked on Lumen-Nexus #13)."

  - id: "C-DUAL-001"
    title: "Dual-steward authorization is not enforceable (mirror)"
    severity: "HIGH"
    status: "OPEN"
    domain: "stewardship"
    statement: "The documented Void steward has read-only repository permission."
    source: "Lumen-Nexus governance/CONTRADICTIONS.yaml"
    consequence: "GD-0001 was ratified in SINGLE_STEWARD mode with this limitation recorded."
