[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "weaver-os"
version = "0.5.0"
description = "Deterministic verification and replay substrate for bounded probabilistic cognition."
requires-python = ">=3.10"
dependencies = [
  "cryptography>=42.0.0",
  "jsonschema>=4.0.0",
  "PyJWT>=2.8"
]

[project.optional-dependencies]
dev = [
  "build>=1.2.0",
  "mypy>=1.8.0",
  "pytest>=7.0.0",
  "rfc8785>=0.1.4",
  "ruff>=0.6.0"
]

[project.scripts]
weaver-release-guard = "weaver_release_guard.cli:main"

[tool.setuptools.packages.find]
where = [".", "src", "packages/contracts", "packages/runtime", "packages/verifier", "packages/witness", "packages/fusion"]
include = [
  "triadic_controls*",
  "weaver_release_guard*",
  "weaver_contracts*",
  "weaver_runtime*",
  "weaver_verifier*",
  "weaver_witness*",
  "weaver_fusion*",
]

[tool.setuptools.package-data]
triadic_controls = ["schemas/*.json"]
weaver_contracts = ["vectors/*.json", "schemas/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests", "weaver_auth/bedrock/tests"]
pythonpath = [".", "src", "packages/contracts", "packages/runtime", "packages/verifier", "packages/witness", "packages/fusion"]

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = ["releases/weaver-witness-signed-rc1"]

[tool.ruff.lint.per-file-ignores]
# Moved verbatim from Lumen-Nexus; byte identity with its source manifest is tested.
"packages/contracts/weaver_contracts/pg001r.py" = ["UP035", "UP037"]
# Moved from Lumen-Nexus with listed import edits only; identity tested in
# tests/verifier/test_pg001r_identity.py.
"packages/verifier/weaver_verifier/pg001r.py" = ["UP035"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = []

[tool.mypy]
python_version = "3.10"
warn_unused_configs = true
ignore_missing_imports = true
